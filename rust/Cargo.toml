# SPDX-License-Identifier: BSD-3-Clause
[workspace]
resolver = "3"
members = ["qdl-macros", "qdl-rs"]

# The Rust code is linked into the C binaries as a static library. Panics
# must not unwind across the C ABI, so abort in every profile. Cargo ignores
# this for test builds, which need unwinding.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
