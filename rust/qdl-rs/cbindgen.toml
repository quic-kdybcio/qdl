# Settings for the qdl_rs.h C header generated by build.rs.

language = "C"
include_guard = "QDL_RS_H"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

# Platform conditions on the Rust side map onto the C preprocessor macros
# that the C code already relies on.
[defines]
"windows" = "_WIN32"
"target_os = macos" = "__APPLE__"

[export.rename]
"Pathbuf" = "pathbuf"
